<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Create Shop Owner | Smart Grocery</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>

	<div th:replace="fragments/navbar :: navbar"></div>

	<div class="container mt-5 mb-5">

		<div class="row justify-content-center">

			<div class="col-md-6">

				<div class="card shadow">

					<div class="card-body p-4">

						<h2 class="text-center mb-4">
							Create Shop Owner
						</h2>

						<p class="text-muted text-center mb-4">
							Admin can create a new shop owner account.
						</p>

						<form id="shopOwnerForm">

							<!-- Name -->
							<div class="mb-3">
								<label for="name" class="form-label">
									Name
								</label>

								<input type="text" id="name" class="form-control" placeholder="Enter shop owner name"
									required>
							</div>

							<!-- Email -->
							<div class="mb-3">
								<label for="email" class="form-label">
									Email
								</label>

								<input type="email" id="email" class="form-control" placeholder="Enter email" required>
							</div>

							<!-- Phone -->
							<div class="mb-3">
								<label for="phone" class="form-label">
									Phone
								</label>

								<input type="tel" id="phone" class="form-control" placeholder="Enter phone number"
									required>
							</div>

							<!-- Password -->
							<div class="mb-3">
								<label for="password" class="form-label">
									Password
								</label>

								<input type="password" id="password" class="form-control" placeholder="Enter password"
									required>
							</div>

							<!-- Confirm Password -->
							<div class="mb-3">
								<label for="confirmPassword" class="form-label">
									Confirm Password
								</label>

								<input type="password" id="confirmPassword" class="form-control"
									placeholder="Confirm password" required>
							</div>

							<!-- Role information -->
							<div class="alert alert-info">
								<strong>Role:</strong> SHOP_OWNER
								<br>
								This role is automatically assigned by the system.
							</div>

							<button type="submit" class="btn btn-success w-100">
								Create Shop Owner
							</button>

						</form>

						<div class="text-center mt-3">

							<a href="/admin/dashboard" class="text-decoration-none">
								Back to Admin Dashboard
							</a>

						</div>

					</div>

				</div>

			</div>

		</div>

	</div>

	<div th:replace="fragments/footer :: footer"></div>

	<script th:src="@{/js/admin-create-shop-owner.js}"></script>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
	</script>

</body>

</html>
