<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>My Cart | Smart Grocery</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

	<!-- Navbar -->

	<div th:replace="fragments/navbar :: navbar"></div>


	<div class="container mt-5">

		<h2 class="text-center mb-4">
			My Shopping Cart
		</h2>


		<!-- Loading -->

		<div id="loadingMessage" class="text-center">

			Loading cart...

		</div>


		<!-- Empty Cart -->

		<div id="emptyCart" class="alert alert-warning text-center" style="display:none;">

			Your cart is empty.

		</div>


		<!-- Cart -->

		<div id="cartContainer" style="display:none;">

			<div class="table-responsive">

				<table class="table table-bordered align-middle">

					<thead class="table-success">

						<tr>

							<th>Product</th>

							<th>Price</th>

							<th>Quantity</th>

							<th>Subtotal</th>

							<th>Action</th>

						</tr>

					</thead>

					<tbody id="cartItems">

					</tbody>

				</table>

			</div>


			<!-- Total -->

			<div class="card mt-4">

				<div class="card-body text-end">

					<h4>

						Total:

						₹ <span id="totalAmount">0</span>

					</h4>

					<div class="d-flex justify-content-end gap-2">
						<button id="clearCartBtn" class="btn btn-danger">

							Clear Cart

						</button>

						<button id="checkoutBtn" class="btn btn-success">

							Proceed to Checkout

						</button>

					</div>


				</div>

			</div>

		</div>


		<!-- Error -->

		<div id="errorMessage" class="alert alert-danger text-center" style="display:none;">

		</div>

	</div>


	<!-- Footer -->

	<div th:replace="fragments/footer :: footer"></div>


	<script th:src="@{/js/cart.js}"></script>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
	</script>

</body>

</html>
