<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Checkout | Smart Grocery</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

	<!-- Navbar -->

	<div th:replace="fragments/navbar :: navbar"></div>

	<div class="container mt-5 mb-5">

		
		<h2 class="text-center mb-4">
			Checkout
		</h2>


		<!-- Loading -->

		<div id="loadingMessage" class="text-center">

			Loading checkout...

		</div>


		<!-- Error -->

		<div id="errorMessage" class="alert alert-danger text-center" style="display:none;">

		</div>


		<!-- Checkout -->

		<div id="checkoutContainer" style="display:none;">

			<div class="row">

				<!-- Order Items -->

				<div class="col-md-8">

					<div class="card shadow-sm">

						<div class="card-header bg-success text-white">

							<h5 class="mb-0">
								Order Summary
							</h5>

						</div>


						<div class="card-body">

							<div class="table-responsive">

								<table class="table align-middle">

									<thead>

										<tr>

											<th>
												Product
											</th>

											<th>
												Price
											</th>

											<th>
												Quantity
											</th>

											<th>
												Subtotal
											</th>

										</tr>

									</thead>


									<tbody id="checkoutItems">

									</tbody>

								</table>

							</div>

						</div>

					</div>

				</div>


				<!-- Total -->

				<div class="col-md-4">

					<div class="card shadow-sm">

						<div class="card-body">

							<h5 class="mb-3">
								Order Total
							</h5>


							<div class="d-flex justify-content-between">

								<span>
									Total Amount
								</span>

								<strong>
									₹ <span id="totalAmount">0</span>
								</strong>

							</div>


							<hr>


							<button id="placeOrderBtn" class="btn btn-success w-100">

								Place Order

							</button>


							<a href="/cart" class="btn btn-outline-secondary w-100 mt-2">

								Back to Cart

							</a>

						</div>

					</div>

				</div>

			</div>

		</div>


		<!-- Empty Cart -->

		<div id="emptyCart" class="alert alert-warning text-center" style="display:none;">

			Your cart is empty.

			<br>

			<a href="/products" class="btn btn-success mt-3">

				Continue Shopping

			</a>

		</div>
		

	</div>

	<!-- Footer -->

	<div th:replace="fragments/footer :: footer"></div>

	<script th:src="@{/js/checkout.js}"></script>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
	</script>

</body>

</html>
