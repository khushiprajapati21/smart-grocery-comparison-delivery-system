<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Products | Smart Grocery</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

	<!-- Navbar -->
	<div th:replace="fragments/navbar :: navbar"></div>

	<div class="container mt-5">

		<h2 class="text-center mb-4">

			Available Products

		</h2>

		<!-- No Products -->

		<div class="alert alert-warning text-center" th:if="${#lists.isEmpty(products)}">

			No Products Available

		</div>

		<!-- Products -->

		<div class="row g-4" th:unless="${#lists.isEmpty(products)}">

			<div class="col-md-3" th:each="product : ${products}">

				<div class="card shadow-sm h-100">

					<!-- Product Image -->

					<img src="https://via.placeholder.com/300x220?text=Product" class="card-img-top"
						style="height:220px; object-fit:cover;">

					<div class="card-body">

						<h5 class="card-title" th:text="${product.productName}">

							Product Name

						</h5>

						<p class="text-success fw-bold">

							₹ <span th:text="${product.price}"></span>

						</p>

						<p class="text-muted small" th:if="${product.categoryName != null}">

							Category :

							<span th:text="${product.categoryName}"></span>

						</p>

						<p class="text-muted small" th:if="${product.shopName != null}">

							Shop :

							<span th:text="${product.shopName}"></span>

						</p>

					</div>

					<div class="card-footer bg-white">

					    <button type="button"
					            class="btn btn-success w-100"
					            th:onclick="'addToCart(' + ${product.id} + ')'">

					        Add To Cart

					    </button>

					</div>

				</div>

			</div>

		</div>

	</div>

	<!-- Footer -->

	<div th:replace="fragments/footer :: footer"></div>
	
	<script th:src="@{/js/products.js}"></script>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
